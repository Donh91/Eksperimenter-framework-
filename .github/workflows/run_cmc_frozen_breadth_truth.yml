name: Run CMC frozen breadth truth layer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_cmc_frozen_breadth.py'
      - '.github/workflows/run_cmc_frozen_breadth_truth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fetch_cmc_frozen_breadth.py'
      - '.github/workflows/run_cmc_frozen_breadth_truth.yml'
      - 'research_triggers/cmc_breadth_truth_*'
  workflow_dispatch:
    inputs:
      start_date:
        description: First date (YYYY-MM-DD)
        required: false
        default: '2023-01-01'
      end_date:
        description: Last complete Sunday (YYYY-MM-DD)
        required: false
        default: '2026-07-05'

permissions:
  contents: read

concurrency:
  group: cmc-frozen-breadth-truth
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Resolve dates
        id: dates
        shell: bash
        run: |
          echo "start=${{ github.event.inputs.start_date || '2023-01-01' }}" >> "$GITHUB_OUTPUT"
          echo "end=${{ github.event.inputs.end_date || '2026-07-05' }}" >> "$GITHUB_OUTPUT"

      - name: Collect frozen universe and breadth
        id: collector
        continue-on-error: true
        run: |
          python scripts/fetch_cmc_frozen_breadth.py \
            --start "${{ steps.dates.outputs.start }}" \
            --end "${{ steps.dates.outputs.end }}" \
            --output CMC_FROZEN_BREADTH_TRUTH
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload auditable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMC_FROZEN_BREADTH_TRUTH_2023_2026
          path: CMC_FROZEN_BREADTH_TRUTH/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Enforce validation
        if: always()
        shell: bash
        run: |
          test -f CMC_FROZEN_BREADTH_TRUTH/CMC_BREADTH_VALIDATION.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('CMC_FROZEN_BREADTH_TRUTH/CMC_BREADTH_VALIDATION.json')
          data = json.loads(p.read_text())
          print(json.dumps(data, indent=2))
          if data.get('status') != 'PASS':
              raise SystemExit(2)
          PY
